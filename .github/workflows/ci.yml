name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # reused as the pre-release gate by release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (strict on core/ and storage/)
        run: mypy

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest with coverage gate
        run: pytest --cov=curlcommander --cov-report=term-missing --cov-fail-under=80

  browser-proxy:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with browser + proxy + oob + ws extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,browser,proxy,oob,ws]"
          python -m playwright install --with-deps chromium
      - name: Browser validators (real Chromium) + proxy addon + OOB crypto + WebSocket tests
        run: pytest tests/test_browser_xss.py tests/test_validators.py tests/test_proxy.py tests/test_oob_interactsh.py tests/test_ws.py -q

  audit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit || true  # advisory: report vulnerabilities, don't block

  # Free/OSS SAST scan (community rulesets, no Semgrep account/token needed).
  # Advisory for now, same as pip-audit above — flip `|| true` off once the
  # existing backlog of findings is triaged, to make this a hard gate.
  semgrep:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep (free OSS engine)
        run: pip install semgrep
      - name: Semgrep SAST scan (auto + secrets + security-audit rulesets)
        run: |
          semgrep scan \
            --config auto \
            --config p/secrets \
            --config p/security-audit \
            --sarif --output semgrep.sarif \
            --error || true
      - name: Upload SARIF as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  # Runs the *remote* installer against the checkout on all three OSes, then
  # confirms curlcmd resolves from PATH and that setup/doctor behave.
  install-smoke:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run remote installer (from checkout) — Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CURLCMD_SOURCE="$PWD" sh scripts/install.sh --yes
          # Publish every dir the installer may have used, so the next step
          # finds curlcmd exactly as a fresh terminal would (uv/pipx/venv shim).
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.curlcommander/venv/bin" >> "$GITHUB_PATH"
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH" 2>/dev/null || true

      - name: Run remote installer (from checkout) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CURLCMD_SOURCE = $PWD.Path
          .\scripts\install.ps1 -Yes
          "$env:LOCALAPPDATA\CurlCommander\bin"          | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:LOCALAPPDATA\CurlCommander\venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $pipxBin = (pipx environment --value PIPX_BIN_DIR 2>$null)
          if ($pipxBin) { $pipxBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: curlcmd resolves from PATH
        shell: bash
        run: |
          which curlcmd || command -v curlcmd
          curlcmd --version

      - name: doctor (fails on an essential ✗)
        shell: bash
        run: curlcmd doctor

      - name: setup --yes is idempotent and non-interactive
        shell: bash
        run: curlcmd setup --yes

  # Item 11: the plain install.ps1 (`Install-WithVenv`) branch fired only
  # when uv/pipx are both absent, and the existing install-smoke (windows)
  # step never forces that — a runner that happens to ship uv/pipx would
  # silently skip exercising the one branch that had the PATH bug. This job
  # forces that branch, then verifies the PATH persisted (not just the
  # current process's already-patched $env:Path) and that a second install
  # never duplicates the PATH entry.
  install-smoke-venv-windows:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hide uv/pipx from PATH (force the Install-WithVenv branch)
        shell: pwsh
        run: |
          $exclude = @()
          foreach ($name in 'uv', 'pipx') {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) { $exclude += (Split-Path $cmd.Source -Parent) }
          }
          if ($exclude.Count -gt 0) {
            $parts = $env:Path -split ';' | Where-Object { $exclude -notcontains $_ }
            $newPath = $parts -join ';'
            "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Confirm uv/pipx are unreachable
        shell: pwsh
        run: |
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw 'uv is still resolvable; the venv branch would not be exercised.' }
          if (Get-Command pipx -ErrorAction SilentlyContinue) { throw 'pipx is still resolvable; the venv branch would not be exercised.' }
          Write-Host 'uv/pipx confirmed absent — Install-WithVenv will run.'

      - name: Run the installer (forces Install-WithVenv)
        shell: pwsh
        run: |
          $env:CURLCMD_SOURCE = $PWD.Path
          .\scripts\install.ps1 -Yes

      - name: curlcmd resolves in a brand-new process (real PATH persistence, not session refresh)
        shell: pwsh
        run: |
          # Rebuild PATH purely from the persistent Machine+User registry values,
          # ignoring this process's own $env:Path (already patched in-session by
          # Update-CurrentSessionPath) — this is what a freshly opened terminal
          # actually sees, and is the scenario the original bug report hit.
          $freshPath = @(
            [Environment]::GetEnvironmentVariable('Path', 'Machine'),
            [Environment]::GetEnvironmentVariable('Path', 'User')
          ) -join ';'

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = 'pwsh'
          $psi.Arguments = '-NoProfile -Command "curlcmd --version"'
          $psi.EnvironmentVariables['Path'] = $freshPath
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false

          $proc = [System.Diagnostics.Process]::Start($psi)
          $proc.WaitForExit()
          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()
          Write-Host $stdout
          if ($proc.ExitCode -ne 0) {
            throw "curlcmd --version failed in a fresh-PATH process (exit $($proc.ExitCode)): $stderr"
          }

      - name: Re-run the installer — PATH entry must not duplicate
        shell: pwsh
        run: |
          $shimDir = Join-Path $env:LOCALAPPDATA 'CurlCommander\bin'
          $env:CURLCMD_SOURCE = $PWD.Path
          .\scripts\install.ps1 -Yes

          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $count = ($userPath -split ';' | Where-Object { $_ -eq $shimDir }).Count
          Write-Host "PATH entries for $shimDir : $count"
          if ($count -ne 1) {
            throw "Expected exactly one PATH entry for $shimDir after a second install, found $count."
          }

  markdown-links:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-verbose-mode: "yes"
          config-file: .github/workflows/mlc_config.json
