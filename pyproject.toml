[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curlcommander"
version = "0.3.1"
description = "Terminal HTTP request builder, curl generator and API/AppSec testing tool"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "CurlCommander contributors" }]
keywords = ["curl", "http", "api", "pentest", "appsec", "security", "fuzzing", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "textual>=0.60",
    "platformdirs>=3.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Ivomsantiago/Curl_Commander"
Repository = "https://github.com/Ivomsantiago/Curl_Commander"
Issues = "https://github.com/Ivomsantiago/Curl_Commander/issues"
Changelog = "https://github.com/Ivomsantiago/Curl_Commander/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
    "pip-audit",
]
socks = ["httpx[socks]"]
clipboard = ["pyperclip"]
build-exe = ["pyinstaller>=6.0", "certifi"]
build-pyz = ["shiv"]
browser = ["playwright>=1.40"]
proxy = ["mitmproxy>=10.0"]

[project.scripts]
curlcmd = "curlcommander.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "F841", "C408"]

[tool.mypy]
python_version = "3.11"
files = ["curlcommander/core", "curlcommander/storage"]
strict = true
warn_unused_ignores = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["httpx.*", "yaml", "playwright.*", "mitmproxy.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["curlcommander"]


[tool.coverage.run]
source = ["curlcommander"]
omit = [
    "curlcommander/gui/*",
    # Browser-gated modules: require the optional [browser] extra + a real
    # Chromium, covered by the dedicated `browser` CI job, not the base gate.
    "curlcommander/core/browser.py",
    "curlcommander/core/validators/xss.py",
    "curlcommander/core/validators/clickjacking.py",
    "curlcommander/core/validators/csrf.py",
    "curlcommander/core/proxy.py",
]
